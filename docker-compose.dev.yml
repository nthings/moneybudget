services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moneybudget
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./web
      target: deps
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/moneybudget
      AUTH_SECRET: ${AUTH_SECRET:-changeme-dev-only-secret}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data_dev:
